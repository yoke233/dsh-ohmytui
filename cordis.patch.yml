# dsh-omp-tui bundle patch (declared by `dsh.bundle.patch`): applied over the
# dsh-base layer when this package appears in a profile's `dsh.profile.bundles`.
# Overrides base rows by id and inserts the terminal front door plus its
# projection/storage support rows.
#
# The tui-startup provider parses the launcher's immutable cmdline snapshot
# (--resume/--session/--help) and provides tuiStartup; agent-loop and the TUI
# row both inject it, so the agent is created before the TUI mounts.

- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true

- id: agent-loop
  inject: [tuiStartup, conversationPersistenceGate, agentDefaultModel]
  config:
    agents:
      - id: main
        sessionId: !!js ctx.tuiStartup.sessionId
        resumeSessionId: !!js ctx.tuiStartup.resumeSessionId
        # Resolve the saved user selection when each process starts instead of
        # pinning every fresh session to the bundle's composition defaults.
        provider: !!js ctx.agentDefaultModel.currentSelection().provider
        model: !!js ctx.agentDefaultModel.currentSelection().model
        cwd: !!js process.cwd()

- id: system-prompt
  config:
    persona: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max

# The local OpenAI-compatible gateway rejects compaction requests that replay
# assistant tool-call messages without `reasoning_content`. Route compaction
# summarization through the DeepSeek adapter/model, which the gateway accepts
# for these replay shapes.
- id: compaction-basic
  config:
    summarizationProvider: deepseek-official
    summarizationModel: deepseek-v4-flash

- id: fs-sandbox
  config:
    cwd: !!js process.cwd()

- id: tools
  config:
    mode: native

- insert:
    - id: session-persistence-conversation-gate
      name: 'dsh-omp-tui/session-persistence'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    # Preset roster: exposes ctx.agentPresets so the TUI can compose the agent
    # from the shipped `standard`/`minimal`/`code`/`cordis` presets and switch
    # between them on a blank session (official backend working modes).
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Profile-owned provider: same first-prompt contract with persistent route settings.
    - id: session-title-llm-tui
      name: 'dsh-omp-tui/session-title'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: tui-prompt
      name: 'dsh-omp-tui/prompt'

    - id: tui-startup
      name: 'dsh-omp-tui/startup'

    # Recompose the live profile after bundle installation without replacing
    # the terminal process or the mounted TUI row.
    - id: tui-reload
      name: 'dsh-omp-tui/reload'

    # WeChat (iLink) bridge: opt-in remote control via the official Tencent
    # WeChat channel. Enable this entry in a later profile patch when needed;
    # keeping it disabled avoids background receivers and account state by default.
    - id: wechat-ilink
      name: 'dsh-omp-tui/wechat'
      disabled: true

    - id: tui
      name: 'dsh-omp-tui'
      inject: [tuiStartup, approval]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId ?? ctx.tuiStartup.resumeSessionId
        showReasoning: true
        maxToolOutputLines: 6
        defaultReasoningEffort: max
        title: dsh

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
